[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidai-rec"
version = "0.4.0"
description = "Record, understand and improve your videos by talking to Claude (under development)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AlsammanAlsamman", email = "sammanmahmoud@gmail.com" }]
maintainers = [{ name = "AlsammanAlsamman", email = "sammanmahmoud@gmail.com" }]
keywords = ["video", "recording", "editing", "claude", "youtube", "speech-to-text", "ffmpeg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Capture",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
  "numpy<3",
  "pillow",
  "pydantic>=2,<3",
  "imageio-ffmpeg",
  "opencv-python-headless",
  "customtkinter",          # vidai/gui.py (recorder window) imports it at module top level
  "faster-whisper",
  "rapidocr-onnxruntime",
  "onnxruntime",            # hub effects / background models (also pulled in by the two above)
  "huggingface-hub",        # model_search / model hub (also pulled in by faster-whisper)
  "piper-tts",
  "mcp>=2,<3",              # the MCP server is the core of the Claude Code plugin
]

[project.optional-dependencies]
record = ["obsws-python", "pynput"]            # OBS backend + global hotkeys (imported lazily, guarded)
live = ["mediapipe"]                           # hand/face trackers, gestures, selfie segmentation (lazy)
mcp = []                                       # kept for backwards compat; mcp is now a base dependency
arabic = ["arabic-reshaper", "python-bidi"]
dev = ["pytest", "ruff"]
all = ["vidai-rec[record,live,arabic,dev]"]

[project.urls]
Homepage = "https://github.com/AlsammanAlsamman/VidAI"
Issues = "https://github.com/AlsammanAlsamman/VidAI/issues"

[project.scripts]
vidai = "vidai.cli:main"
vidai-mcp = "vidai.mcp_server:main"

[tool.setuptools.packages.find]
include = ["vidai*"]

[tool.setuptools.package-data]
vidai = ["assets/*.png", "native/*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs Whisper on real speech (downloads a model on first run)"]
# slow tests are skipped by default; `pytest -m slow` overrides this (the last -m wins)
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# lenient, high-signal only: syntax errors, undefined names, unused imports/vars, mutable defaults
select = ["E9", "F63", "F7", "F82", "F401", "F841", "B006", "B008"]
