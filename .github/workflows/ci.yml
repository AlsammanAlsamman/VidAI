name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System packages
        # ffmpeg comes bundled via imageio-ffmpeg; gcc builds the optional native helpers; tk for customtkinter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc python3-tk
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,arabic]"
      - name: Ruff
        run: ruff check vidai tests
      - name: Tests (slow Whisper tests are skipped by default)
        run: pytest -q
